services:
  postgres:
    image: pgvector/pgvector:pg16
    # The demo is exposed publicly, so the stack has to come back by itself
    # after a reboot or a docker daemon restart. "migrate" keeps restart: "no"
    # -- it is a one-shot that must exit 0 exactly once.
    restart: unless-stopped
    environment:
      POSTGRES_USER: smieciarka
      POSTGRES_PASSWORD: smieciarka
      POSTGRES_DB: smieciarka
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smieciarka"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for listing photos, S3 API on port 4566.
  #
  # The spec names MinIO, and the application code is plain S3 (boto3), so it
  # runs against either. LocalStack is here only because MinIO no longer
  # publishes a pullable public image -- docker.io/minio/minio and
  # quay.io/minio/minio both refuse anonymous pulls. Swapping back is this
  # service block plus the two S3 endpoint values on api; nothing in app/
  # changes.
  #
  # Unpinned on purpose: no schema depends on the version, and data lives in
  # a volume.
  s3:
    image: localstack/localstack:4
    restart: unless-stopped
    environment:
      SERVICES: s3
      # The bucket is created by the API on first upload, not by an init job.
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - s3data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: brings the schema to head, then exits 0. The api service waits
  # for that exit, so `docker compose up` never serves against a stale schema.
  # Idempotent -- re-running on an up-to-date database is a no-op.
  migrate:
    build: .
    # Same tag as api: one build, one image, two entrypoints.
    image: smieciarka-backend:latest
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      # Overrides DATABASE_URL from .env, which points at localhost for the
      # host-side venv workflow. Inside the network the database is "postgres".
      DATABASE_URL: postgresql+asyncpg://smieciarka:smieciarka@postgres:5432/smieciarka
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: smieciarka-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smieciarka:smieciarka@postgres:5432/smieciarka
      # Inside the container network the store is "s3"; the client reaches it
      # over the demo tunnel at s3.wkrynski.dev. Both are needed: the API
      # uploads over the internal name, but a presigned URL is signed for the
      # host the client will call, and SigV4 covers the Host header -- so the
      # two cannot be swapped after signing. See services/storage.py.
      #
      # For an emulator-only run with no tunnel, set S3_PUBLIC_ENDPOINT to
      # http://10.0.2.2:4566 (10.0.2.2 is the emulator's alias for the host)
      # and point api_config.dart at the same host.
      S3_ENDPOINT: http://s3:4566
      # Defaults to the demo tunnel. Set S3_PUBLIC_ENDPOINT in the shell or in
      # .env to the address phones use (LAN IP, or the server's public address).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-https://s3.wkrynski.dev}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    healthcheck:
      # python, not curl: the slim base image ships no HTTP client.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  s3data:
